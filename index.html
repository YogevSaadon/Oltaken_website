<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <title>Oltaken</title>
    <meta name="description" content="Oltaken makes apps and games. First app: DrifTick, a clock that shows your whole day." />

    <!-- Link preview card (Reddit, X, Discord, WhatsApp). Crawlers don't run JavaScript or
         accept SVG, so these are static, with absolute URLs and a PNG image. -->
    <meta property="og:site_name" content="Oltaken" />
    <meta property="og:title" content="Oltaken" />
    <meta property="og:description" content="Oltaken makes apps and games. First app: DrifTick, a clock that shows your whole day." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yogevsaadon.github.io/Oltaken_website/" />
    <meta property="og:image" content="https://yogevsaadon.github.io/Oltaken_website/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Oltaken logo" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Start fetching the hero logo with the page, so it doesn't pop in after the scripts load -->
    <link rel="preload" as="image" type="image/svg+xml" href="/src/assets/branding/oltaken-software-logo.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
